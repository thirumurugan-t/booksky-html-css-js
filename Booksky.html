<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>

   
    <link rel="stylesheet" href="Booksky.css">

   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>

    <h1>Booksky</h1>

    <div class="containers">
        <div class="container">
            <h3>Rich Dad Poor Dad</h3>
            <h6>Robert</h6>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus dolor recusandae corrupti beatae, est
                quam repellat reiciendis consequuntur enim delectus dignissimos!</p>
            <button onclick="Delete(event)">Delete</button>
        </div>
    </div>

    <button class="buttonplus" id="add-popup-button">+</button>

    <div class="popup-overlay"></div>

    <div class="popup-box">
        <div class="boxes3">
            <form>
                <h2>Add Book</h2>
                <input placeholder="Book Title" id="booktitle">
                <input placeholder="Book Author" id="bookauthor">
                <input placeholder="Short Description" id="bookdes"></input>
                <button class="buttons" id="plusbutton" type="submit">Add</button>
                <button class="buttons" id="cancelbutton" type="button">Cancel</button>
            </form>
        </div>
    </div>

    <script src="Booksky.js"></script>
</body>
</html>
